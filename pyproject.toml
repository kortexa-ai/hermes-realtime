[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-realtime"
version = "0.5.1"
description = "Direct WebRTC and LiveKit Conference voice gateways for hermes-agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "kortexa.ai", email = "info@kortexa.ai" }]
license = "MIT"
dependencies = [
  # Hermes is the host, not a pip dependency: current source checkouts publish
  # placeholder package version 0.0.0 and PM owns their environment. The native
  # manifest checks the real Hermes runtime version before loading this plugin.
  # Exact transport SDK pins keep their updates deliberate. Update the pins
  # AND verify release notes / security advisories before changing.
  #   livekit==1.1.14     released 2026-07-31, no yanks; includes
  #                        remote-disconnect queue cleanup and race fixes.
  #   livekit-api==1.2.0   released 2026-07-11, no yanks.
  # Shared libraries use bounded ranges so Hermes can select its own pins
  # without evicting this plugin during a host update. Pillow JPEG-encodes
  # sampled video frames for Hermes' vision pipeline via media_urls.
  "livekit==1.1.14",
  "livekit-api==1.2.0",
  "Pillow>=12.3.0,<14",
  # Direct OpenAI-compatible WebRTC signalling and media. aiortc 1.15.0
  # requires av>=14,<18; pinning the selected wheel keeps installs deliberate.
  "aiohttp>=3.14.5,<4",
  "aiortc==1.15.0",
  "av==17.0.0",
  # Silero VAD runs by default. The pinned model ships inside the package
  # (hermes_realtime/models), so a plain install needs no download step.
  "onnxruntime==1.29.0",
  "numpy>=2.4.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[project.entry-points."hermes_agent.plugins"]
# Point to the package, not the function — the hermes-agent plugin loader
# does ep.load() and then getattr(module, "register"), so the target must
# resolve to the module itself.
realtime = "hermes_realtime"

[tool.setuptools.packages.find]
include = ["hermes_realtime*"]

[tool.setuptools.package-data]
hermes_realtime = ["models/*", "plugin.yaml", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not kortexa_hermes"]
markers = [
  "kortexa_hermes: requires the adjacent kortexa-ai/hermes-agent checkout and its optimized pipeline fixes",
]
